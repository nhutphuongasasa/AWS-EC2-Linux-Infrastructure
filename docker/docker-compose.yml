services:
  nginx:
    image: nginx:1.27-alpine
    container_name: lab_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    volumes:
      - ./src:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    depends_on:
      - php
    networks:
      - frontend

  php:
    build:
      context: ./php
    container_name: lab_php
    restart: unless-stopped
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    environment:
      DB_HOST: mariadb
      DB_NAME: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASSWORD}
    volumes:
      - ./src:/var/www/html:ro
    tmpfs:
      - /tmp
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - frontend
      - backend

  mariadb:
    image: mariadb:11.4
    container_name: lab_mariadb
    restart: unless-stopped
    read_only: true
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /srv/data/mariadb:/var/lib/mysql
      - ./mariadb/conf.d:/etc/mysql/conf.d:ro
    tmpfs:
      - /tmp
      - /run/mysqld
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

#volumes:
#  db_data:

networks:
  frontend:
  backend:
    internal: true